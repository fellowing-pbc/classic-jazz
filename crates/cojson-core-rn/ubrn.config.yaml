---
# Pin ALL package-name-derived identifiers to their pre-rename values. ubrn
# otherwise derives them from package.json name (@fellowing/cojson-core-rn ->
# "fellowing-cojson-core-rn"), which regenerates the Kotlin loadLibrary call,
# the cpp adapter filename, CMake target, and C++ namespaces out of sync with
# the committed sources - the -fellowing.0 tarball shipped mixed names and
# was unusable on both platforms.
name: cojson-core-rn

rust:
  directory: .
  manifestPath: rust/Cargo.toml


ios:
  # Pin the pre-rename framework name: ubrn otherwise derives it from the npm
  # package name (@fellowing/cojson-core-rn -> FellowingCojsonCoreRnFramework),
  # silently orphaning the podspec's vendored_frameworks and the CI upload path.
  frameworkName: CojsonCoreRnFramework
  targets:
    - aarch64-apple-ios
    - aarch64-apple-ios-sim
    - x86_64-apple-ios

# This has been made to allow compilation with -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON
# Once the new Uniffi version 0.30.0, which supports this flag, is released, we will be able to remove it.
noOverwrite:
  - "android/build.gradle"
